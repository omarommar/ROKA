<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الأدمن | 𝕽𝕺𝕶𝕬</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a class="logo" href="/">𝕽𝕺𝕶𝕬</a><button id="logout" class="small-btn">تسجيل خروج</button></header><main class="admin-wrap"><h1>لوحة تحكم 𝕽𝕺𝕶𝕬</h1><p class="muted">ضيف الصور والأغاني والكلام اللي يظهر في الموقع.</p><section class="admin-card"><h2>رسالة الترحيب</h2><textarea id="welcomeInput" rows="3" placeholder="اكتب رسالة الترحيب"></textarea><button id="saveWelcome" class="pink-btn">حفظ الرسالة</button></section><section class="admin-card"><h2>إضافة صورة وذكرى</h2><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><input id="photoCaption" placeholder="اكتب تعليق الصورة"><button id="uploadPhoto" class="pink-btn">رفع الصورة</button></section><section class="admin-card"><h2>إضافة كلام جديد</h2><textarea id="quoteText" rows="3" placeholder="اكتب جملة أو ذكرى"></textarea><button id="addQuote" class="pink-btn">إضافة الكلام</button></section><section class="admin-card"><h2>إضافة أغنية</h2><input id="audioTitle" placeholder="اسم الأغنية"><input id="audioFile" type="file" accept="audio/mpeg,audio/mp4,audio/ogg,audio/wav,audio/aac"><button id="uploadAudio" class="pink-btn">رفع الأغنية</button><p class="muted">ارفع ملف صوتي تملكه أو عندك إذن باستخدامه.</p></section><section class="admin-card"><h2>المحتوى الحالي</h2><div id="itemsList"></div></section><p id="status" role="status"></p></main><script src="/admin.js"></script></body></html>
